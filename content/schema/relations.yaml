# --- history ----------------------------------------------------------------
involved:
  {label: involved, inverse: involved in, from: [event], to: [person, org, place, group, artifact], owner: from, layers: [history], qualifiers: [role]}
# The same body under a new name or form: a party renamed, a company reorganised, a city renamed.
# Lets a long-lived thing be two entries, each with honest dates, without breaking its line.
# `identity`: answers about the later form include the earlier one ("as the Bolsheviks"); both
# sides of a claim must have the same type, and an identity is never `attributed`.
became:
  {label: became, inverse: formerly, from: [org, group, place, tradition, artifact], to: [org, group, place, tradition, artifact], owner: from, layers: [history], temporal: true, qualifiers: [title], identity: true}
part_of:
  {label: part of, inverse: includes, from: [event, org, place, work, artifact, tradition], to: [event, org, place, tradition, work, group], owner: from, layers: [history], temporal: true, noun: true, inverse_reads: verb}
caused_by:
  {label: caused by, inverse: caused, from: [event], to: [event, artifact, concept], owner: from, layers: [history], noun: true, inverse_reads: verb}
led_to:
  {label: led to, inverse: followed from, from: [event, artifact, concept, work], to: [event, org, artifact, concept, work], owner: from, layers: [history], inverse_reads: verb}
adopted:
  {label: adopted, inverse: adopted by, from: [org, place, group], to: [concept, work], owner: from, layers: [power, ideas], temporal: true}

# "Who benefited" is an interpretation: give it `according_to` and quote the voice that says so.
benefited_from:
  {label: benefited from, inverse: benefited, from: any, to: [event], owner: from, layers: [power, history], attributed: true, traversable: false, inverse_reads: verb}
# The mirror of benefited_from ("who lost"), equally interpretive and attributed.
harmed_by:
  {label: harmed by, inverse: harmed, from: any, to: [event], owner: from, layers: [power, history], attributed: true, traversable: false, noun: true, inverse_reads: verb}
# One side says a study's finding is not shown, in its own words (ADR-0019). Never a verdict: the page
# prints both sides, and nothing here decides between them. Never a route: disputing a study connects
# nobody to it.
disputes_finding:
  {label: disputes a finding of, inverse: finding disputed by, from: [person, org, work], to: [work], owner: from, layers: [ideas], temporal: true, attributed: true, traversable: false, dispute: true, caveat: "Each side is quoted in its own words. Whether a finding holds is not decided here."}
