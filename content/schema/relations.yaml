# Relation types. A claim `rel` must be one of these.
#   from / to   allowed entity types of the owning entity and the target ("any" = all types)
#   owner       which side's file holds the claim (always "from" in v0)
#   layers      which layers (and therefore lenses) show it
#   temporal    whether `when` is meaningful
#   qualifiers  extra fields allowed on the claim
#   traversable used by the path finder (default true)
#   passive     collapsed by default ("index funds")
#   sensitive   stricter sourcing and review (two independent T1/T2 voices or one T1); a claim that
#               falls short is withheld from the site until it is sourced
#   kinship     a family relation; entity pages gather these into "Family ties". Only joins types with
#               `family: true`. Its `role` describes the claim's owner: `role: mother` = from is to's mother
#   attributed  an interpretation: every claim must name whose account it is (`according_to`);
#               must be `traversable: false`, so routes never run through one side's account
#   identity    the same body under a new name (`became`): question answers about the later form
#               include the earlier one. Joins two entries of one type; never `attributed`
#   noun        the label is not a verb (a title, a noun or a participle: "CEO of", "born in"), so a
#               sentence puts it after a comma: "Mike Markkula, CEO of Apple"
#   background  shown in a person's "Background" card: born in, citizen of, educated at (ADR-0016)
#   inverse_reads how the inverse joins a sentence: after a comma by default ("Apple, founded by Steve
#               Jobs"); `verb` ("includes", "caused"); or `list`, a plural that names the others ("Apple,
#               board members: Mike Markkula and Arthur Rock")
#   legal       a step of a legal case (ADR-0018): shown in the "Legal records" card of the one it is
#               about, beside the other steps of its `case`. Must be sensitive and not traversable, and
#               every claim needs `when`
#   dispute     one side saying a study's finding is not shown (ADR-0019): shown in "The debate" on the
#               study's page and the disputer's. Must be attributed; each claim is its owner's own
#               account (`according_to: [<owner>]`), quoted in its words, about a work with a `finding`
#   caveat      a plain sentence shown with records of this relation ("A charge is an accusation …")

# --- people & power ---------------------------------------------------------
founded:
  {label: founded, inverse: founded by, from: [person, org, group, place], to: [org, tradition, artifact, work, concept, group, place], owner: from, layers: [people, power], temporal: true, qualifiers: [role]}
ceo_of:
  {label: CEO of, inverse: CEO, from: [person], to: [org], owner: from, layers: [power, money], temporal: true, noun: true}
chair_of:
  {label: chair of, inverse: chaired by, from: [person], to: [org], owner: from, layers: [power], temporal: true, qualifiers: [title], noun: true}
head_of:
  {label: head of, inverse: headed by, from: [person], to: [org, place, tradition, group], owner: from, layers: [power], temporal: true, qualifiers: [title], noun: true}
member_of:
  {label: member of, inverse: members, from: [person, org, place], to: [org, group, tradition], owner: from, layers: [people], temporal: true, qualifiers: [role], noun: true, inverse_reads: list}
worked_at:
  {label: worked at, inverse: people who worked here, from: [person], to: [org], owner: from, layers: [people], temporal: true, qualifiers: [role, title], inverse_reads: list}
relative_of:
  {label: relative of, inverse: relative of, from: [person], to: [person], owner: from, layers: [people], qualifiers: [role], sensitive: true, kinship: true, noun: true}
# Citizenship (ADR-0016), dated when a source dates it (a naturalization, a renunciation). Never a
# route: sharing a passport is not a connection.
citizen_of:
  {label: citizen of, inverse: citizens, from: [person], to: [place], owner: from, layers: [people], temporal: true, traversable: false, noun: true, inverse_reads: list, background: true}
signatory_of:
  {label: signed, inverse: signed by, from: [person, org], to: [work, org, concept], owner: from, layers: [people, money], temporal: true}
enacted:
  {label: signed into law, inverse: enacted by, from: [person, org], to: [concept, work, org], owner: from, layers: [power], temporal: true}
intervened_in:
  {label: intervened in, inverse: interventions, from: [person, org], to: [event], owner: from, layers: [power, history], temporal: true, qualifiers: [role], inverse_reads: list}
leads:
  {label: leads, inverse: led by, from: [person, org], to: [event, group, org, place], owner: from, layers: [history, power], temporal: true}
# Backstories (pack 2): schools and board seats are where many doors open.
educated_at:
  {label: educated at, inverse: alumni and students, from: [person], to: [org], owner: from, layers: [people], temporal: true, qualifiers: [role, title], noun: true, inverse_reads: list, background: true}
board_member_of:
  {label: board member of, inverse: board members, from: [person], to: [org], owner: from, layers: [power, people], temporal: true, qualifiers: [role, title], noun: true, inverse_reads: list}

# --- legal records (ADR-0018) ------------------------------------------------
# A step of a case, from the one the record is about to whoever decided, dated, in the record's own
# words (`title`: "securities fraud", "without admitting or denying the allegations"). `case` names the
# case as the record does; its steps sit together on the page. Sourced from the court's, regulator's
# or government's own record, and never a route: being charged by one regulator connects nobody.
charged_by:
  {label: charged by, inverse: charged, from: [person, org], to: [org, place], owner: from, layers: [power], temporal: true, qualifiers: [title, case], sensitive: true, traversable: false, legal: true, noun: true, inverse_reads: verb, caveat: "A charge is an accusation, not a finding of guilt."}
convicted_by:
  {label: convicted by, inverse: convicted, from: [person, org], to: [org, place], owner: from, layers: [power], temporal: true, qualifiers: [title, case], sensitive: true, traversable: false, legal: true, noun: true, inverse_reads: verb}
acquitted_by:
  {label: acquitted by, inverse: acquitted, from: [person, org], to: [org, place], owner: from, layers: [power], temporal: true, qualifiers: [title, case], sensitive: true, traversable: false, legal: true, noun: true, inverse_reads: verb}
# A court that set aside an earlier decision in the same case: a conviction, a fine.
overturned_by:
  {label: decision overturned by, inverse: overturned a decision about, from: [person, org], to: [org, place], owner: from, layers: [power], temporal: true, qualifiers: [title, case], sensitive: true, traversable: false, legal: true, noun: true, inverse_reads: verb}
settled_with:
  {label: settled with, inverse: settled with, from: [person, org], to: [org, place], owner: from, layers: [power, money], temporal: true, qualifiers: [title, case, amount, currency], sensitive: true, traversable: false, legal: true, inverse_reads: verb}
sanctioned_by:
  {label: sanctioned by, inverse: sanctioned, from: [person, org], to: [org, place], owner: from, layers: [power], temporal: true, qualifiers: [title, case], sensitive: true, traversable: false, legal: true, noun: true, inverse_reads: verb}

# --- money ------------------------------------------------------------------
invested_in:
  {label: invested in, inverse: investors, from: [person, org], to: [org], owner: from, layers: [money], temporal: true, qualifiers: [amount, currency, role], inverse_reads: list}
holds_for_clients:
  {label: holds shares for clients in, inverse: shares held for clients by, from: [org], to: [org], owner: from, layers: [money], temporal: true, qualifiers: [percent, shares, as_of], passive: true}
owns_stake:
  {label: owns a stake in, inverse: stakeholders, from: [person, org], to: [org], owner: from, layers: [money], temporal: true, qualifiers: [percent, shares, as_of], inverse_reads: list}
acquired:
  {label: acquired, inverse: acquired by, from: [person, org], to: [org, artifact], owner: from, layers: [money], temporal: true, qualifiers: [amount, currency]}
contracted:
  {label: awarded a contract to, inverse: contracts from, from: [org], to: [org], owner: from, layers: [money, tech], temporal: true, qualifiers: [amount, currency, title]}
# Money given without buying a stake (subsidies, grants, secret payments). Use invested_in for equity.
funded:
  {label: funded, inverse: funded by, from: [person, org, place, group], to: [org, person, group, event], owner: from, layers: [money, power], temporal: true, qualifiers: [amount, currency, role]}
# A broker sending its customers' orders to a market maker to be executed. When the market maker pays
# for them (payment for order flow), say so in a `note`: such an arrangement need not be a contract.
routed_orders_to:
  {label: routed customer orders to, inverse: received customer orders from, from: [org], to: [org], owner: from, layers: [money], temporal: true, inverse_reads: verb}

