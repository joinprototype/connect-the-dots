note: "Doukas was a Greek Christian historian writing after the events; he calls the Ottomans Turks and Scythians and the sultans tyrants. Read in English, in the translator's edition. Doukas was not an eyewitness of the siege of 1453; he writes that he spoke to Turks afterwards."
