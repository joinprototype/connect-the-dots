note: "Davidson says in his preface that he was war correspondent with the Japanese army in 1895; the title page names him Consul of the United States for Formosa. His account of the Republic is hostile to its officials. The book prints a translation of the declaration and the Peking and Tientsin Times report of the Shimonoseki talks. The scan is OCR text."
