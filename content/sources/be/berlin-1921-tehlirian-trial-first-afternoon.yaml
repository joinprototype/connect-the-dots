note: "Berlin court record of 1921 as translated into English and published in 1985 by an Armenian-American press; the page is a wiki that reproduces that translation. We read the English only, not the German. The translation puts the word \"genocide\" in 1921 mouths, which the German of 1921 could not have had, so we quote nothing with that word from it, and captions say \"1985 English translation\". The morning session, with Tehlirian's own testimony, we could not read; speakers, interpreter and place names are as the translation gives them."
