note: "The Nahua account of the conquest, written down in Nahuatl by Nahua authors working with the Franciscan friar Sahagún. It was put down decades after the events, with Nahua authors working under a Franciscan whose aim was conversion (a lesson sheet's description). The scan's text has optical-reading errors; the story quotes only passages that read cleanly."
