# Editorial picks: which connections get a generated story on the home page and in Stories,
# and which life stories sit on the home shelf. Ids are entity ids (aliases work too).
# The first connection is drawn as the example route on the home page; the first four are the
# "Try" links. Later ones appear in the Stories library only.
# A pair can carry a note the route story states up front: {between: [a, b], note: "…"}.
# `questions` are question pages as <question>/<entity id> (content/schema/questions.yaml): the Ask
# form's "Try" links and the first books of the Questions shelf, always kept when pages are capped.
connections:
