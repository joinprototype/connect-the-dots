# Editorial picks. Ids are entity ids (aliases work too).
# `threads` open the home page, in order: one name and the written stories it runs through. A person
# reviews every pick: people, organizations and places only, none sealed (ADR-0027), nothing that
# groups anyone by heritage (ADR-0016), and no persecution story beside modern finance. A story
# counts from two scenes on the name, and a thread needs two stories, or the home page leaves it out.
# `connections` each get a generated route story in the Stories library.
# A pair can carry a note the route story states up front: {between: [a, b], note: "…"}.
# `questions` are question pages as <question>/<entity id> (content/schema/questions.yaml): the
# first books of the Questions shelf, always kept when pages are capped.
threads: [standard-oil, john-d-rockefeller, cia, harvard-university, ford-motor-company, zurich, boeing, federal-reserve]
connections:
  - [moses, elon-musk]
  - [bill-gates, ibm]
  - [german-imperial-government, dissolution-of-the-soviet-union]
  - [jeff-bezos, sputnik-1]
  - [gutenberg-bible, spacex]
  - between: [mark-zuckerberg, cia]
    note: "Each step below is a documented business link. No source here says the CIA or In-Q-Tel had any role in Facebook."
  - [jeff-bezos, google]
  - [pope-john-xxiii, nikita-khrushchev]
  - [sputnik-1, blue-origin]
  - between: [rand-corporation, arpanet]
    note: "This is a route of links, not a line of cause. The ARPANET's builders say RAND's work ran in parallel with theirs; Paul Baran says Larry Roberts had seen his reports."
  - between: [rise-of-cities-in-mesopotamia, bible]
    note: "Two steps rest on one historian's account each, and say so. Movable type came first in China and Korea; this route follows the alphabet."
