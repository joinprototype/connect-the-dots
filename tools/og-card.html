<title>Share card</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #111113; }
  body {

    color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;

  .brand { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }

  .route { margin-top: auto; }
  .stops { display: grid; grid-template-columns: repeat(8, 1fr); align-items: end; }
  .stops span { padding: 0 6px; text-align: center; font-size: 19px; font-weight: 500; line-height: 1.2; color: #d1d1d6; }
  .route svg { display: block; width: 100%; height: 34px; margin-top: 10px; }
  line { stroke: #2997ff; stroke-width: 2.5; }
  .dashed { stroke-dasharray: 8 7; }
  circle.stop { fill: #111113; stroke: #2997ff; stroke-width: 2.5; }
  circle.end { fill: #2997ff; }
</style>
